name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paygate
          POSTGRES_PASSWORD: paygate
          POSTGRES_DB: geo_dmp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paygate -d geo_dmp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://paygate:paygate@localhost:5432/geo_dmp_test
      TEST_DATABASE_URL: postgresql://paygate:paygate@localhost:5432/geo_dmp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
